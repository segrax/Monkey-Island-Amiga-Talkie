name: Release

on:
  push:
    tags: ['**']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event.deleted == false
    uses: ./.github/workflows/build-tools.yml
    with:
      ref: ${{ github.ref }}

  release:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.build.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release tag still matches the built commit
        env:
          TAG: ${{ github.ref_name }}
          COMMIT: ${{ needs.build.outputs.commit }}
        run: |
          set -euo pipefail
          test "$(git rev-parse "refs/tags/$TAG^{commit}")" = "$COMMIT"
          git merge-base --is-ancestor "$COMMIT" origin/main
      - uses: actions/download-artifact@v8
        with:
          pattern: '*-x64'
          path: dist
          merge-multiple: true
      - name: Generate checksums
        working-directory: dist
        run: sha256sum 'Build Amiga Talkie.exe' build-amiga-talkie > SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            'dist/Build Amiga Talkie.exe' \
            dist/build-amiga-talkie \
            dist/SHA256SUMS \
            --verify-tag --generate-notes --title "$TAG"
